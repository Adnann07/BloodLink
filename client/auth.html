<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – BloodLink</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">

  <!-- Navbar -->
  <nav>
    <span class="nav-brand">BloodLink</span>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="#">Donor</a></li>
      <li><a href="#">Donate</a></li>
      <li><a href="askai.html">Ask AI</a></li>
      <li><a href="#">Volunteers</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <div class="nav-right">
      <a href="auth.html" class="nav-login">Log in or create account</a>
      <button class="btn-nav">Donate Now</button>
    </div>
  </nav>
  <div class="nav-underline"></div>

  <!-- Auth Box -->
  <div class="auth-page">
    <div class="auth-card">

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="loginForm">
        <h2>Welcome Back</h2>
        <p class="auth-sub">Login to your BloodLink account</p>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" />
        </div>

        <div class="auth-error" id="loginError"></div>

        <button type="button" class="btn-auth" onclick="handleLogin()">Login</button>

        <p class="auth-switch">Don't have an account? <a href="#" onclick="switchTab('register')">Register</a></p>
      </form>

      <!-- Register Form -->
      <form class="auth-form hidden" id="registerForm">
        <h2>Create Account</h2>
        <p class="auth-sub">Join BloodLink today</p>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Enter your full name" />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Create a password" />
        </div>

        <div class="form-group">
          <label>Phone (optional)</label>
          <input type="text" id="regPhone" placeholder="Enter your phone number" />
        </div>

        <div class="form-group">
          <label>Role</label>
          <select id="regRole" onchange="handleRoleChange()">
            <option value="">Select your role</option>
            <option value="donor">Donor</option>
            <option value="hospital">Hospital</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <!-- Donor Fields -->
        <div class="extra-fields hidden" id="donorFields">
          <div class="form-group">
            <label>Blood Group</label>
            <select id="regBloodGroup">
              <option value="">Select blood group</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
          <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="regDob" />
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select id="regGender">
              <option value="">Select gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Weight (kg) (optional)</label>
            <input type="number" id="regWeight" placeholder="Enter your weight" />
          </div>
        </div>

        <!-- Hospital Fields -->
        <div class="extra-fields hidden" id="hospitalFields">
          <div class="form-group">
            <label>Hospital Name</label>
            <input type="text" id="regHospitalName" placeholder="Enter hospital name" />
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="regCity" placeholder="Enter city" />
          </div>
          <div class="form-group">
            <label>License Number (optional)</label>
            <input type="text" id="regLicense" placeholder="Enter license number" />
          </div>
        </div>

        <div class="auth-error" id="registerError"></div>

        <button type="button" class="btn-auth" onclick="handleRegister()">Create Account</button>

        <p class="auth-switch">Already have an account? <a href="#" onclick="switchTab('login')">Login</a></p>
      </form>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
