name: CI Pipeline - Lint & Build

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  ci-check:
    name: Lint + Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run ESLint (non-blocking)
        working-directory: ./client
        run: npm run lint || echo "Linting failed or has warnings - continuing anyway"
        continue-on-error: true

      - name: Build Frontend
        working-directory: ./client
        run: npm run build
